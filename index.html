<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Brief System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card-form { max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-form">
        <h3 class="mb-4 text-center">📝 Input Brief Baru</h3>
        
        <form id="briefForm">
            <div class="mb-3">
                <label class="form-label">Nama Klien / Brand</label>
                <input type="text" class="form-control" id="klien" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Layanan</label>
                <select class="form-select" id="layanan" required>
                    <option value="">-- Pilih Layanan --</option>
                    <option value="Influencer Marketing">Influencer Marketing</option>
                    <option value="Digital Performance">Digital Performance</option>
                    <option value="Affiliate">Affiliate</option>
                    <option value="Live Shopping">Live Shopping</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Detail Brief</label>
                <textarea class="form-control" id="detail" rows="4" required></textarea>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nama PIC</label>
                    <input type="text" class="form-control" id="picName" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email PIC</label>
                    <input type="email" class="form-control" id="picEmail" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mt-3" id="btnSubmit">Assign Brief & Kirim Email</button>
        </form>

        <div id="statusMessage" class="mt-3 text-center" style="display:none;"></div>
    </div>
</div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI
    const GOOGLE_SCRIPT_URL = "MASUKKAN_URL_WEB_APP_GOOGLE_APPS_SCRIPT_DI_SINI";

    document.getElementById('briefForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btnSubmit = document.getElementById('btnSubmit');
        const statusMsg = document.getElementById('statusMessage');
        
        btnSubmit.disabled = true;
        btnSubmit.innerText = "Mengirim data & email...";
        
        const payload = {
            klien: document.getElementById('klien').value,
            layanan: document.getElementById('layanan').value,
            detail: document.getElementById('detail').value,
            picName: document.getElementById('picName').value,
            picEmail: document.getElementById('picEmail').value
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload),
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                statusMsg.style.display = "block";
                statusMsg.className = "alert alert-success mt-3";
                statusMsg.innerText = "Berhasil! Brief ID: " + data.id + " tersimpan dan email terkirim.";
                document.getElementById('briefForm').reset();
            }
        })
        .catch(error => {
            statusMsg.style.display = "block";
            statusMsg.className = "alert alert-danger mt-3";
            statusMsg.innerText = "Terjadi kesalahan koneksi.";
            console.error('Error!', error.message);
        })
        .finally(() => {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Assign Brief & Kirim Email";
        });
    });
</script>

</body>
</html>
