<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency Brief System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card-form { max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-form">
        <h3 class="mb-4 text-center">📝 Input Brief Baru</h3>
        
        <form id="briefForm">
            <div class="mb-3">
                <label class="form-label">Nama Klien / Brand</label>
                <input type="text" class="form-control" id="klien" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Layanan</label>
                <select class="form-select" id="layanan" required>
                    <option value="">-- Pilih Layanan --</option>
                    <option value="Influencer Marketing">Influencer Marketing</option>
                    <option value="Digital Performance">Digital Performance</option>
                    <option value="Affiliate">Affiliate</option>
                    <option value="Live Shopping">Live Shopping</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Detail Brief</label>
                <textarea class="form-control" id="detail" rows="4" required></textarea>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nama PIC</label>
                    <input type="text" class="form-control" id="picName" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email PIC</label>
                    <input type="email" class="form-control" id="picEmail" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mt-3" id="btnSubmit">Assign Brief & Kirim Email</button>
        </form>

        <div id="statusMessage" class="mt-3 text-center" style="display:none;"></div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQtcYvP1j01FPj6xcf-8m1RotEIbNenlXr_X3fXnIeYjXurLnY4gq7f23yxnR5QRKEuQ/exec";

    document.getElementById('briefForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btnSubmit = document.getElementById('btnSubmit');
        const statusMsg = document.getElementById('statusMessage');
        
        btnSubmit.disabled = true;
        btnSubmit.innerText = "Mengirim data & email...";
        
        const payload = new URLSearchParams();
        payload.append("klien", document.getElementById('klien').value);
        payload.append("layanan", document.getElementById('layanan').value);
        payload.append("detail", document.getElementById('detail').value);
        payload.append("picName", document.getElementById('picName').value);
        payload.append("picEmail", document.getElementById('picEmail').value);

        // Menambahkan mode 'no-cors' agar browser mengabaikan blokiran Google
        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: payload
        })
        .then(() => {
            // Karena pakai no-cors, kita anggap sukses jika tidak ada masalah jaringan
            statusMsg.style.display = "block";
            statusMsg.className = "alert alert-success mt-3";
            statusMsg.innerText = "🎉 Berhasil! Brief telah tersimpan dan email terkirim ke PIC.";
            document.getElementById('briefForm').reset();
        })
        .catch(error => {
            statusMsg.style.display = "block";
            statusMsg.className = "alert alert-danger mt-3";
            statusMsg.innerText = "Gagal. Periksa koneksi internet Anda.";
            console.error('Error:', error);
        })
        .finally(() => {
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Assign Brief & Kirim Email";
        });
    });
</script>
